[project]
name = "kiboy"
version = "1.0.0"
description = "AI News Daily — Automated news aggregation and content pipeline"
requires-python = ">=3.10"
dependencies = [
    "Pillow>=10.0",
    "numpy>=1.24",
]

[project.scripts]
kiboy = "kiboy.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
